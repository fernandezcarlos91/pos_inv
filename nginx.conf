server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Inclusión explícita de MIME types para garantizar que .css, .js, etc. se sirvan adecuadamente
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compresión gzip para optimizar la transferencia de estilos y scripts
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy hacia el backend (red interna de Docker) para todas las llamadas /api/*
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Manejo de assets estáticos generados por Vite (/assets/*.css, /assets/*.js)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Archivos estáticos en la raíz (iconos, imágenes, fuentes)
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Evitar caché en index.html para permitir actualizaciones inmediatas del frontend
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Manejo de enrutamiento SPA para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Manejo de errores 404 para rutas de SPA
    error_page 404 /index.html;
}